name: mimic-midterm-demo

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8080:8080"
    environment:
      DEMO_ARTIFACT_ROOT: /app/artifacts
    volumes:
      # Mount model JSON only (summary.json + export/). Do not mount raw MIMIC data.
      - ./artifacts:/app/artifacts:ro

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend
